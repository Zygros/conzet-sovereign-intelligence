name: Materialize Federation Edges
on:
  push:
    paths:
      - 'scripts/generate_crossconnect_edges.py'
      - '.github/workflows/materialize-federation-edges.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate deterministic 600-edge graph
        run: python3 scripts/generate_crossconnect_edges.py
      - name: Verify exact artifact
        run: |
          test "$(wc -l < graph/repository_edges.jsonl)" -eq 600
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('graph/repository_edges.jsonl')
          rows=[json.loads(x) for x in p.read_text().splitlines()]
          assert len(rows)==600
          pairs={(r['source'],r['target']) for r in rows}
          assert len(pairs)==600
          assert all(a!=b for a,b in pairs)
          print('verified=600 unique directed edges')
          PY
      - name: Commit generated artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graph/repository_edges.jsonl
          git diff --cached --quiet && exit 0
          git commit -m 'Materialize and verify 600 repository federation edges'
          git push
