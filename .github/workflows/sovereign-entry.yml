name: Sovereign entry point

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [integrate/unified]

jobs:
  sovereign:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install entry-point dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest mpmath

      - name: Run sovereign test
        run: python -m sovereign test

      - name: Run sovereign verify-math
        run: python -m sovereign verify-math
