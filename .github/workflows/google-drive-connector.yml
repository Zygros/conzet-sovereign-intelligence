name: Google Drive Connector Validation

on:
  push:
    paths:
      - "connectors/google-drive/**"
      - ".github/workflows/google-drive-connector.yml"
  pull_request:
    paths:
      - "connectors/google-drive/**"
      - ".github/workflows/google-drive-connector.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connectors/google-drive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        run: npm run typecheck
