[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-10"
version = "0.1.0"
description = "OMEGA-10 v0.1: Evidence Substrate"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Justin Neal Thomas Conzet"}]
dependencies = ["pydantic>=2.0", "pyyaml>=6.0", "cryptography>=42.0", "click>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
